name: Five-Job 50-Second Success Workflow

on:
  workflow_dispatch:

jobs:
  job-1-checkout-info:
    name: Job 1 - Repository Metadata
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Inspect repository status
        run: |
          echo "Run ID: ${{ github.run_id }}"
          git status --short
          git log -1 --oneline

  job-2-structure-check:
    name: Job 2 - Directory Structure Audit
    needs: [ job-1-checkout-info ]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify workflow files exist
        run: |
          ls -la .github/workflows
          wc -l .github/workflows/*.yml

  job-3-checksum-manifest:
    name: Job 3 - Generate File Checksums
    needs: [ job-2-structure-check ]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compute SHA-256 checksums
        run: |
          find . -maxdepth 3 -type f ! -path '*/.git/*' -exec sha256sum {} +

  job-4-python-validation:
    name: Job 4 - Environment & Config Check
    needs: [ job-3-checksum-manifest ]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Python sanity check
        run: |
          python3 -c "import os, platform; print('OS:', platform.system(), '| Files:', len(os.listdir('.')))"

  job-5-release-summary:
    name: Job 5 - Final Release Summary
    needs: [ job-4-python-validation ]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Print completion summary
        run: |
          echo "All 5 jobs completed successfully at $(date -u)"
